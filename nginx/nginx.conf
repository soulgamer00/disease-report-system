# nginx/nginx.conf
server {
    listen 80;
    server_name _; # หรือใส่ domain/IP ของคุณ ถ้ามี

    # Frontend (เนื่องจาก Nginx อยู่ใน Docker network เดียวกันกับ frontend service)
    location / {
        # ใช้ชื่อ service ของ Docker Compose (frontend) แทน IP ของ Host
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API (เนื่องจาก Nginx อยู่ใน Docker network เดียวกันกับ backend service)
    location /api/ {
        # ใช้ชื่อ service ของ Docker Compose (backend) แทน IP ของ Host
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public API
    location /public/ {
        # ใช้ชื่อ service ของ Docker Compose (backend) แทน IP ของ Host
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# docker-compose.yml (Updated with Server IP)

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dxdb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dxdb
      POSTGRES_USER: dxdbadmin
      POSTGRES_PASSWORD: 123456
      POSTGRES_SCHEMA: dbdx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dxdbadmin -d dxdb"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dxdb-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      TZ: Asia/Bangkok
      # Database
      DATABASE_URL: "postgresql://dxdbadmin:123456@postgres:5432/dxdb?schema=dbdx"
      # JWT Secrets (เปลี่ยนใน production)
      JWT_SECRET: "f3f6c8e1a0b5d7e9f2a4c6b8d0e2f1a3b5c7d9e1f3a5c7b9d1e3f5a7b9c1d3e5"
      JWT_REFRESH_SECRET: "1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"
      JWT_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "7d"
      # Cookie Secret
      COOKIE_SECRET: "1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1o"
      # Security
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
      # CORS (Updated to Server IP)
      FRONTEND_URL: "http://128.199.99.215:5173"
      # Logging
      LOG_LEVEL: "info"
      ENABLE_FILE_LOGGING: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        npx prisma db push &&
        npm run dev
      "

  # Frontend Service  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dxdb-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Bangkok
      # Updated to Server IP
      VITE_API_URL: "http://128.199.99.215:3000"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app-network
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge